# ==========================================
# Smart Helpdesk Ticket System - Compose
# ==========================================
# Usage:
#   docker compose up --build            # build & start in foreground
#   docker compose up -d --build         # detached
#   docker compose down                  # stop everything
#   docker compose down -v               # stop + delete volumes (wipes DB)
#
# Override any env by creating a `.env` in the repo root with:
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
#   DATABASE_URL, SECRET_KEY, ALGORITHM, ACCESS_TOKEN_EXPIRE_MINUTES
# (See .env.example for the full template.)
#
# App URLs once running:
#   Frontend  → http://localhost:3000
#   Backend   → http://localhost:8000  (docs at /docs)
#   Postgres  → localhost:5432  (use a DB client to inspect)

services:
  # ---------- Postgres ----------
  db:
    image: postgres:16-alpine
    container_name: helpdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Backend (FastAPI) ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/helpdesk}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-please}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/docs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- Frontend (Next.js) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: helpdesk-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      # Inside the Docker network, the backend service is reachable as "backend".
      BACKEND_URL: http://backend:8000
      # Uncomment if you want the client to hit the backend directly:
      # NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    name: helpdesk_postgres_data
